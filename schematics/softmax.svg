<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" class="schematic-canvas" id="schematic-svg" data-title="softmax - Hardware Safe Softmax Unit">
<defs>
    <style><![CDATA[
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg: #090d13;
            --panel: #111827;
            --card: #1f2937;
            --card-header: #374151;
            --border: #374151;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --bus-color: #60a5fa;
            --bus-width: 3.5px;
            --wire-color: #94a3b8;
            --control-color: #f59e0b;
            --highlight: #22d3ee;
            --pe-bg: #131d2e;
            --pe-border: #2563eb;
            --mac-bg: #1e1b4b;
            --mac-border: #6366f1;
            --reg-bg: #142e2b;
            --reg-border: #10b981;
            --mult-bg: #31132b;
            --mult-border: #ec4899;
        }
        
        text {
            font-family: 'Inter', -apple-system, sans-serif;
            user-select: none;
        }
        
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Interactive Component Styling */
        .component-box {
            cursor: pointer;
            transition: all 0.25s ease;
        }
        
        .component-box:hover .box-rect {
            stroke: var(--highlight);
            stroke-width: 2.5px;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }
        
        .toggle-btn {
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .toggle-btn:hover circle {
            fill: var(--highlight);
        }
        
        /* Collapsible Elements */
        .collapsible-content {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .collapsed .collapsible-content {
            display: none;
            opacity: 0;
        }
        .collapsed .expanded-only {
            display: none;
        }
        .expanded .collapsed-only {
            display: none;
        }
        
        /* Wire and Bus Styling */
        .net-bus {
            fill: none;
            stroke: var(--bus-color);
            stroke-width: 3.5px;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s, stroke-width 0.2s, filter 0.2s;
        }
        
        .net-control {
            fill: none;
            stroke: var(--control-color);
            stroke-width: 1.5px;
            stroke-dasharray: 4 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s, stroke-width 0.2s;
        }
        
        .net-wire {
            fill: none;
            stroke: var(--wire-color);
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s, stroke-width 0.2s;
        }
        
        .net-active {
            stroke: #f43f5e !important;
            stroke-width: 4.5px !important;
            filter: drop-shadow(0 0 8px #f43f5e) !important;
        }
        
        .net-highlight {
            stroke: #38bdf8 !important;
            stroke-width: 4.5px !important;
            filter: drop-shadow(0 0 10px #38bdf8) !important;
        }
        
        /* Ports and Pins */
        .pin-node {
            cursor: pointer;
            transition: r 0.2s, fill 0.2s;
        }
        .pin-node:hover {
            r: 6px;
            fill: var(--highlight);
        }
        
        /* Tooltip */
        #svg-tooltip {
            position: absolute;
            display: none;
            background: rgba(17, 24, 39, 0.95);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            border: 1px solid #38bdf8;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 1000;
        }
        
        /* Toolbar inside SVG */
        .svg-toolbar {
            fill: #111827;
            stroke: #374151;
            stroke-width: 1px;
            rx: 6px;
        }
        .svg-tool-btn {
            cursor: pointer;
        }
        .svg-tool-btn:hover rect {
            fill: #1f2937;
            stroke: #38bdf8;
        }
    ]]></style>
    
    <!-- Gradients and Markers -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a0f18" />
        <stop offset="100%" stop-color="#04070c" />
    </linearGradient>
    
    <linearGradient id="peGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="macGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2d1b4e" />
        <stop offset="100%" stop-color="#19102c" />
    </linearGradient>
    
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#064e3b" />
        <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    
    <linearGradient id="multGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#701a75" />
        <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <marker id="bus-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="wire-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="ctrl-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
</defs>

<!-- Background -->
<rect width="100%" height="100%" fill="url(#bgGrad)" />

<!-- Grid Pattern -->
<pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6" />
</pattern>
<rect width="100%" height="100%" fill="url(#dotGrid)" />

<!-- Canvas Viewport for Pan/Zoom -->
<g id="viewport" transform="translate(0, 0) scale(1)">


    <g transform="translate(40, 80)">
        <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="700">🔬 MODULE: softmax</text>
        <text x="0" y="24" fill="#94a3b8" font-size="13">Safe Softmax Pipeline: Max Search → Delta Subtraction → Exp LUT → Normalizer</text>
    </g>

    <!-- Main Softmax Component Box -->
    <g id="comp_softmax" class="collapsible-comp expanded" transform="translate(180, 140)">
        <g class="component-box" onclick="toggleComponent('comp_softmax')">
            <rect class="box-rect" x="0" y="0" width="640" height="380" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
            <rect x="0" y="0" width="640" height="42" rx="12" fill="#6b21a8" />
            <rect x="0" y="30" width="640" height="12" fill="#6b21a8" />
            
            <text x="24" y="27" fill="#faf5ff" font-size="15" font-weight="700">⚙️ softmax Pipeline (Safe Max-Subtraction)</text>
            <text x="360" y="26" fill="#e9d5ff" font-size="12" font-family="'JetBrains Mono', monospace">VEC_SIZE = 4, DATA = 8</text>
        </g>
        
        <g class="collapsible-content expanded-only">
            <!-- 4 Stages of Safe Softmax -->
            <g transform="translate(25, 65)">
                <!-- Stage 1: Max Finder -->
                <rect x="0" y="0" width="135" height="270" rx="6" fill="#0f172a" stroke="#818cf8" />
                <rect x="0" y="0" width="135" height="28" rx="6" fill="#3730a3" />
                <text x="67" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1. Max-Search</text>
                <text x="67" y="60" fill="#c7d2fe" font-size="10" text-anchor="middle">Find M = max(x_i)</text>
                <text x="67" y="90" fill="#94a3b8" font-size="9" text-anchor="middle">Safe Softmax:</text>
                <text x="67" y="110" fill="#94a3b8" font-size="9" text-anchor="middle">Prevents exp()</text>
                <text x="67" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">overflow</text>

                <!-- Stage 2: Subtraction -->
                <rect x="150" y="0" width="135" height="270" rx="6" fill="#0f172a" stroke="#38bdf8" />
                <rect x="150" y="0" width="135" height="28" rx="6" fill="#0369a1" />
                <text x="217" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2. Delta Shift</text>
                <text x="217" y="60" fill="#bae6fd" font-size="10" text-anchor="middle">Δ_i = x_i - M</text>
                <text x="217" y="90" fill="#94a3b8" font-size="9" text-anchor="middle">All Δ_i &lt;= 0</text>
                <text x="217" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">Mapped to (0, 1]</text>

                <!-- Stage 3: Exp LUT -->
                <rect x="300" y="0" width="135" height="270" rx="6" fill="#0f172a" stroke="#ec4899" />
                <rect x="300" y="0" width="135" height="28" rx="6" fill="#9d174d" />
                <text x="367" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">3. Exp LUT</text>
                <text x="367" y="60" fill="#fbcfe8" font-size="10" text-anchor="middle">e^(Δ_i) in Q0.8</text>
                <text x="367" y="90" fill="#94a3b8" font-size="9" text-anchor="middle">exp(0) = 255</text>
                <text x="367" y="110" fill="#94a3b8" font-size="9" text-anchor="middle">exp(-1) = 94</text>
                <text x="367" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">exp(-2) = 35</text>

                <!-- Stage 4: Normalization -->
                <rect x="450" y="0" width="135" height="270" rx="6" fill="#0f172a" stroke="#22c55e" />
                <rect x="450" y="0" width="135" height="28" rx="6" fill="#15803d" />
                <text x="517" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">4. Normalizer</text>
                <text x="517" y="60" fill="#bbf7d0" font-size="10" text-anchor="middle">Sum &amp; Divide</text>
                <text x="517" y="90" fill="#94a3b8" font-size="9" text-anchor="middle">sum = Σ e^(Δ)</text>
                <text x="517" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">prob_i =</text>
                <text x="517" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">(e_i * 255) / sum</text>
            </g>
        </g>
    </g>
    
</g>

<!-- Integrated Interactive Controls Toolbar -->
<g id="ui-toolbar" transform="translate(20, 20)">
    <rect width="360" height="42" class="svg-toolbar" rx="8" />
    
    <g class="svg-tool-btn" onclick="toggleAllComponents(true)" transform="translate(10, 7)">
        <rect width="100" height="28" rx="5" fill="#1f2937" stroke="#4b5563" />
        <text x="50" y="18" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">➕ Expand All</text>
    </g>
    
    <g class="svg-tool-btn" onclick="toggleAllComponents(false)" transform="translate(118, 7)">
        <rect width="105" height="28" rx="5" fill="#1f2937" stroke="#4b5563" />
        <text x="52" y="18" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">➖ Collapse All</text>
    </g>
    
    <g class="svg-tool-btn" onclick="toggleControls()" transform="translate(230, 7)">
        <rect width="120" height="28" rx="5" fill="#1f2937" stroke="#4b5563" />
        <text x="60" y="18" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle">⚡ Toggle Control</text>
    </g>
</g>

<!-- Tooltip Container -->
<g id="tooltip-group" style="display: none; pointer-events: none;">
    <rect id="tooltip-bg" fill="#111827" stroke="#38bdf8" stroke-width="1.5" rx="6" opacity="0.95" />
    <text id="tooltip-text" fill="#f3f4f6" font-size="12" font-family="'JetBrains Mono', monospace" y="0"></text>
</g>

<script><![CDATA[
    // Interactive Collapsible Schematic Logic
    let showControlNets = true;
    let currentHighlightedNet = null;

    function toggleComponent(id) {
        const comp = document.getElementById(id);
        if (!comp) return;
        const isCollapsed = comp.classList.contains('collapsed');
        if (isCollapsed) {
            comp.classList.remove('collapsed');
            comp.classList.add('expanded');
        } else {
            comp.classList.remove('expanded');
            comp.classList.add('collapsed');
        }
        updateBadge(comp);
    }

    function updateBadge(comp) {
        const badge = comp.querySelector('.toggle-badge text');
        if (badge) {
            badge.textContent = comp.classList.contains('collapsed') ? '+' : '−';
        }
    }

    function toggleAllComponents(expand) {
        const comps = document.querySelectorAll('.collapsible-comp');
        comps.forEach(c => {
            if (expand) {
                c.classList.remove('collapsed');
                c.classList.add('expanded');
            } else {
                c.classList.remove('expanded');
                c.classList.add('collapsed');
            }
            updateBadge(c);
        });
    }

    function toggleControls() {
        showControlNets = !showControlNets;
        const ctrls = document.querySelectorAll('.net-control, .control-port');
        ctrls.forEach(el => {
            el.style.display = showControlNets ? '' : 'none';
        });
    }

    function highlightNet(netName) {
        if (currentHighlightedNet === netName) {
            clearHighlight();
            return;
        }
        clearHighlight();
        currentHighlightedNet = netName;
        const wires = document.querySelectorAll(`[data-net="${netName}"]`);
        wires.forEach(w => {
            w.classList.add('net-highlight');
        });
    }

    function clearHighlight() {
        if (currentHighlightedNet) {
            const wires = document.querySelectorAll(`[data-net="${currentHighlightedNet}"]`);
            wires.forEach(w => w.classList.remove('net-highlight'));
            currentHighlightedNet = null;
        }
    }

    function showTooltip(evt, text) {
        const tt = document.getElementById('tooltip-group');
        const bg = document.getElementById('tooltip-bg');
        const txt = document.getElementById('tooltip-text');
        if (!tt || !txt || !bg) return;
        
        txt.textContent = text;
        const bbox = txt.getBBox();
        bg.setAttribute('width', bbox.width + 16);
        bg.setAttribute('height', bbox.height + 12);
        bg.setAttribute('x', bbox.x - 8);
        bg.setAttribute('y', bbox.y - 6);
        
        // Position near mouse
        const pt = getSVGPoint(evt);
        tt.setAttribute('transform', `translate(${pt.x + 12}, ${pt.y - 20})`);
        tt.style.display = 'block';
    }

    function hideTooltip() {
        const tt = document.getElementById('tooltip-group');
        if (tt) tt.style.display = 'none';
    }

    function getSVGPoint(evt) {
        const svg = document.getElementById('schematic-svg');
        const pt = svg.createSVGPoint();
        pt.x = evt.clientX;
        pt.y = evt.clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    // Pan and Zoom support
    let isPanning = false;
    let startX = 0, startY = 0;
    let translateX = 0, translateY = 0, scale = 1;
    const viewport = document.getElementById('viewport');

    window.addEventListener('load', () => {
        const svg = document.getElementById('schematic-svg');
        if (!svg) return;

        svg.addEventListener('mousedown', (e) => {
            if (e.target.closest('.component-box') || e.target.closest('.svg-tool-btn')) return;
            isPanning = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            viewport.setAttribute('transform', `translate(${translateX}, ${translateY}) scale(${scale})`);
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        svg.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const newScale = Math.min(Math.max(scale * zoomFactor, 0.3), 5.0);
            scale = newScale;
            viewport.setAttribute('transform', `translate(${translateX}, ${translateY}) scale(${scale})`);
        });
    });
]]></script>
</svg>