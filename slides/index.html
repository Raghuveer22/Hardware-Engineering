<html lang="en">
<head>

    <style>
        :root {
            --bg-obsidian: #080c14;
            --bg-panel: #0d131f;
            --bg-card: #121927;
            --bg-card-hover: #182235;
            --border: #202b3d;
            --border-glow: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --accent-cyan: #38bdf8;
            --accent-emerald: #34d399;
            --accent-amber: #fbbf24;
            --accent-rose: #fb7185;
            --accent-purple: #c084fc;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top App Navigation */
        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.02em;
        }

        .brand-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select.lab-picker {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        .btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-cyan);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(37, 99, 235, 0.25));
            color: var(--accent-cyan);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .btn-primary:hover {
            background: var(--accent-cyan);
            color: #080c14;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* Presentation Workspace */
        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .slide-frame {
            width: 100%;
            max-width: 1240px;
            aspect-ratio: 16 / 9;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.97) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Slide Top Banner */
        .slide-topbar {
            padding: 16px 28px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .slide-pill {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        .slide-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .slide-subheading {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Bento Grid Content Container */
        .slide-bento {
            flex: 1;
            padding: 18px 28px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
            overflow-y: auto;
        }

        /* Bento Box Components */
        .bento-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            transition: all 0.2s ease;
        }

        .bento-card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .bento-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .bento-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
        }

        .stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-cyan);
            line-height: 1.1;
        }

        .stat-lbl {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .bento-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            line-height: 1.45;
            color: #cbd5e1;
        }

        .bento-list li {
            position: relative;
            padding-left: 16px;
        }

        .bento-list li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .code-snippet {
            background: #06090f;
            border: 1px solid #1e293b;
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem;
            color: #e2e8f0;
            overflow-x: auto;
            white-space: pre;
            line-height: 1.42;
        }

        /* Interactive Animation Widget Box */
        .anim-box {
            background: #06090f;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .anim-ctrl-btn {
            background: #1e293b;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .anim-ctrl-btn:hover {
            background: var(--accent-cyan);
            color: #080c14;
        }

        /* Systolic Grid Animation */
        .pe-mesh {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 220px;
        }

        .pe-mesh-cell {
            aspect-ratio: 1;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
        }

        .pe-mesh-cell.active {
            background: rgba(56, 189, 248, 0.25);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
            color: #fff;
        }

        /* Slide Footer & Navigation */
        .slide-bottombar {
            padding: 10px 28px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            margin: 0 24px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-emerald));
            width: 10%;
            transition: width 0.25s ease;
        }

        .slide-nav-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="brand-group">
            <span class="brand-title">⚡ Hardware AI Acceleration</span>

    <!-- Presentation Engine Script -->
    <script>
        const deck = [
            // Slide 0: Title
            {
                pill: "Curriculum Architecture",
                title: "Hardware AI Acceleration & Tensor Core Engineering",
                subtitle: "Pre-Silicon Design, 2D Systolic Matrix Meshes, and LLM Transformer SFUs",
                bento: `
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-cyan);">
                        <div class="stat-val" style="color: var(--accent-cyan);">9 Labs</div>
                        <div class="stat-lbl">Full Silicon Flow</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-emerald);">
                        <div class="stat-val" style="color: var(--accent-emerald);">O(3N)</div>
                        <div class="stat-lbl">Systolic Wavefront</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-amber);">
                        <div class="stat-val" style="color: var(--accent-amber);">200×</div>
                        <div class="stat-lbl">DRAM vs ALU Energy</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-purple);">
                        <div class="stat-val" style="color: var(--accent-purple);">100%</div>
                        <div class="stat-lbl">Cocotb Verified</div>
                    </div>

                    <div class="bento-card" style="grid-column: span 8;">
                        <div class="bento-title">🎯 Curriculum Scope & Topics</div>
                        <ul class="bento-list">
                            <li><strong>Tier 1: Core Arithmetic (Labs 00-02):</strong> Signed Adders with Saturation, INT8 Multipliers, and 32-bit Pipelined MAC Units.</li>
                            <li><strong>Tier 2: 2D Tensor Meshes (Labs 03-04):</strong> Weight-Stationary Processing Elements & 4x4 Systolic Array Wavefronts.</li>
                            <li><strong>Tier 3: Transformer SFUs (Labs 05-08):</strong> Square Root (Attention Scaling), Safe Softmax, Fast rsqrt (RMSNorm), and exp2 (SwiGLU).</li>
                        </ul>
                    </div>

                    <div class="bento-card" style="grid-column: span 4;">
                        <div class="bento-title">📦 Downloadable Presentations</div>
                        <p style="font-size:0.8rem; color:#94a3b8; margin-bottom:8px;">Ready-to-present widescreen PowerPoint decks:</p>
                        <div style="display:flex; flex-direction:column; gap:6px;">
                            <a href="Hardware_AI_Acceleration_Master_Slides.pptx" download class="btn btn-primary" style="justify-content:center;">📥 Master Deck (All 9 Labs)</a>
                            <a href="Lab04_Systolic_Matrix_Multiplier.pptx" download class="btn" style="justify-content:center;">📥 Lab 04 Systolic Array Deck</a>
                        </div>
                    </div>
                `
            },
            // Slide 1: Lab 00 Theory
            {
                pill: "Lab 00 | Core Arithmetic",
                title: "Parameterized Signed Adder & Saturation Arithmetic",
                subtitle: "Preventing catastrophic activation wrap-around in deep learning inference",
                bento: `
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-cyan);">
                        <div class="stat-val" style="color: var(--accent-cyan);">O(N)</div>
                        <div class="stat-lbl">Gate Complexity</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-emerald);">
                        <div class="stat-val" style="color: var(--accent-emerald);">[-128, 127]</div>
                        <div class="stat-lbl">INT8 Range</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-rose);">
                        <div class="stat-val" style="color: var(--accent-rose);">+150 ➔ -106</div>
                        <div class="stat-lbl">Wrap-Around Error</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-amber);">
                        <div class="stat-val" style="color: var(--accent-amber);">+127 / -128</div>
                        <div class="stat-lbl">Clamped Output</div>
                    </div>

                    <div class="bento-card" style="grid-column: span 6;">
                        <div class="bento-title">📚 1-Bit Full Adder Boolean Logic</div>
                        <ul class="bento-list">
                            <li><strong>Sum:</strong> \\(S = A \\oplus B \\oplus C_{\\text{in}}\\)</li>
                            <li><strong>Carry Out:</strong> \\(C_{\\text{out}} = (A \\cdot B) + (C_{\\text{in}} \\cdot (A \\oplus B))\\)</li>
                            <li><strong>Linear Complexity:</strong> 8-bit adder requires only 8 full adders (≈ 40 basic gates).</li>
                        </ul>
                    </div>

                    <div class="bento-card" style="grid-column: span 6;">
                        <div class="bento-title">⚠️ The Inversion Disaster & Saturation Rule</div>
                        <ul class="bento-list">
                            <li><strong>The Problem:</strong> A positive neuron activation wrapping to negative completely inverts predictions!</li>
                            <li><strong>Detection:</strong> \\(\\text{overflow} = (A_{\\text{sign}} == B_{\\text{sign}}) \\ \\&\\&\\ (S_{\\text{sign}} \\ne A_{\\text{sign}})\\)</li>
                            <li><strong>Saturation Clamping:</strong> Mux positive overflow to \\(+127\\) and negative to \\(-128\\).</li>
                        </ul>
                    </div>
                `
            },
            // Slide 2: Lab 00 Live Interactive Simulator
            {
                pill: "Lab 00 | Live Simulation",
                title: "Two's Complement Adder & Saturation Simulator",
                subtitle: "Interactive bit-level overflow demonstration and clamping logic",
                bento: `
                    <div class="bento-card" style="grid-column: span 6;">
                        <div class="bento-title">💻 SystemVerilog Implementation</div>
                        <div class="code-snippet">assign raw_sum   = {a[7], a} + {b[7], b};
assign overflow  = (a[7] == b[7]) && (raw_sum[7] != a[7]);
assign carry_out = raw_sum[8];

always_comb begin
  if (saturate && overflow)
    sum = a[7] ? -128 : +127;
  else
    sum = raw_sum[7:0];
end</div>
                    </div>

                    <div class="bento-card anim-box" style="grid-column: span 6;">
                        <div style="font-family:'Space Grotesk'; font-weight:700; color:var(--accent-cyan); font-size:1.05rem;">⚡ Interactive Adder Calculator</div>
                        <div style="display:flex; gap:12px; align-items:center;">
                            <input type="number" id="simA" value="100" min="-128" max="127" style="width:70px; background:#1e293b; color:#fff; border:1px solid #334155; padding:6px; border-radius:6px; font-weight:bold;">
                            <span style="font-weight:bold; font-size:1.1rem;">+</span>
                            <input type="number" id="simB" value="50" min="-128" max="127" style="width:70px; background:#1e293b; color:#fff; border:1px solid #334155; padding:6px; border-radius:6px; font-weight:bold;">
                            <label style="font-size:0.85rem; color:var(--accent-emerald); font-weight:600;"><input type="checkbox" id="simSat" checked> Saturation</label>
                        </div>
                        <button class="anim-ctrl-btn" onclick="runAdderSim()">Evaluate Hardware Datapath</button>
                        <div id="simRes" style="font-family:'JetBrains Mono'; font-size:0.95rem; color:var(--accent-emerald); font-weight:700;">Result: +127 (Clamped Saturation)</div>
                    </div>
                `
            },
            // Slide 3: Lab 01 Multiplier
            {
                pill: "Lab 01 | Multiplier Datapaths",
                title: "Parameterized Signed Multiplier (INT8)",
                subtitle: "Partial products, Wallace trees, and bit-growth management",
                bento: `
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-cyan);">
                        <div class="stat-val" style="color: var(--accent-cyan);">O(N²)</div>
                        <div class="stat-lbl">Quadratic Area</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-emerald);">
                        <div class="stat-val" style="color: var(--accent-emerald);">16 Bits</div>
                        <div class="stat-lbl">Required Product</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-amber);">
                        <div class="stat-val" style="color: var(--accent-amber);">1 DSP</div>
                        <div class="stat-lbl">FPGA Slice Usage</div>
                    </div>
                    <div class="bento-card bento-stat" style="grid-column: span 3; border-color: var(--accent-purple);">
                        <div class="stat-val" style="color: var(--accent-purple);">10k Tests</div>
                        <div class="stat-lbl">Cocotb Monte Carlo</div>
                    </div>

                    <div class="bento-card" style="grid-column: span 7;">
                        <div class="bento-title">📚 Multiplier Architectures Comparison</div>
                        <ul class="bento-list">
                            <li><strong>Array Multiplier:</strong> \\(O(N^2)\\) area with \\(O(N)\\) ripple delay.</li>
                            <li><strong>Wallace / Dadda Tree:</strong> \\(O(N^2)\\) area with \\(O(\\log N)\\) carry-save tree reduction.</li>
                            <li><strong>Radix-4 Booth Encoding:</strong> Halves partial products from \\(N\\) to \\(N/2\\), standard in Tensor Cores.</li>
                            <li><strong>Corner Case:</strong> \\((-128) \\times (-128) = +16,384\\) (0x4000) requires full 16-bit signed range.</li>
                        </ul>
                    </div>

                    <div class="bento-card" style="grid-column: span 5;">
                        <div class="bento-title">💻 RTL Snippet</div>
                        <div class="code-snippet">module multiplier_int8 #(
  parameter int A_WIDTH   = 8,
  parameter int B_WIDTH   = 8,
  parameter int OUT_WIDTH = 16
)(
  input  logic signed [A_WIDTH-1:0] a, b,
  output logic signed [OUT_WIDTH-1:0] p
);
  always_comb p = a * b;
endmodule</div>
                    </div>
                `
            },
            // Slide 4: Lab 02 MAC Unit
            {
                pill: "Lab 02 | MAC Engines",
                title: "Pipelined Multiply-Accumulate (MAC) Unit",
                subtitle: "Accumulator sizing and cycle-by-cycle pipelining for matrix dot products",
                bento: `

                    }
                }
            }
        }

        window.onload = () => {
            renderCurrentSlide();
        };
    </script>
</body>
