<g class="hier-plus" onclick="toggleComponent('comp_top')" transform="translate(124, 52)"><rect width="16" height="16" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="8" y="12.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#000000">-</text></g>
<line class="pin-stub" x1="106" y1="76.0" x2="134" y2="76.0"/>
